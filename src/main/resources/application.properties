spring.application.name=marketplace-desafio-api
server.port=${SERVER_PORT:8082}

# PostgreSQL Supabase (session pooler)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USER:postgres.cwbrhxfhzdflaykcjqjo}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

# Configuração didática. As entidades podem criar ou atualizar as tabelas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger e OpenAPI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# BCrypt: rodadas de hash aplicadas na senha (mais = mais seguro, mais lento)
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Chave secreta (Base64, mínimo 32 bytes) usada para assinar/validar tokens.
# Valor padrão apenas para desenvolvimento.
security.jwt.secret=${JWT_SECRET:c2VncmVkby1qd3QtZGlkYXRpY28tMzItYnl0ZXMtMTIzNDU2Nzg=}

# Quem emitiu o token (campo "iss" do payload)
security.jwt.issuer=${JWT_ISSUER:marketplace-desafio-api}

# Tempo de vida do token em segundos (900s = 15 minutos)
security.jwt.expiracao-segundos=${JWT_EXPIRATION_SECONDS:900}

