spring.application.name=marketplace-desafio-api
server.port=${SERVER_PORT:8082}

# Conexão local padrão. Para Supabase ou outro PostgreSQL, substitua as três
# variáveis de ambiente sem alterar este arquivo.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace_desafio}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Configuração didática. As entidades podem criar ou atualizar as tabelas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger e OpenAPI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# BCrypt e JWT.

# Quantas rodadas de hash o BCrypt aplica na senha(mais = mais seguro, mais lento)
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}

#A Chave secreta usada para assinar/validar tokens
#Esse valor é só o padrão de desenvolvimento. Em produção vem de variável de ambiente).
security.jwt.secret=${JWT_SECRET:c2VncmVkby1qd3QtZGlkYXRpY28tMzItYnl0ZXMtMTIzNDU2Nzg=}

# Quem emitiu o token - vai dentro do payload como campo "iss"
security.jwt.issuer=${JWT_ISSUER:marketplace-desafio-api}

#Tempo de vida do token em segundos(900s = 15 minutos)
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

server.error.include-message=always
